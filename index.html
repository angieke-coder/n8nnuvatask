<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單字小精靈 - 學習儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 引入 SweetAlert2 做超美彈出視窗 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-800 pb-20">
  <div class="max-w-md mx-auto mt-4">
    <!-- 頂部儀表板 -->
    <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-lg mb-6">
      <h1 class="text-2xl font-bold mb-2">🚀 我的學習進度</h1>
      <p class="text-indigo-200 text-sm mb-4" id="user-greeting">讀取中...</p>
      <div class="flex justify-between items-end">
        <div>
          <p class="text-4xl font-black" id="word-count">0</p>
          <p class="text-xs text-indigo-200 mt-1">待複習單字</p>
        </div>
      </div>
    </div>

    <div id="loading" class="text-center text-slate-500 animate-pulse my-10">資料同步中...</div>
    <div id="word-list" class="space-y-4"></div>
  </div>

  <script>
    // 你的三個專屬金鑰已設定完成
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3MqmYHS66UFBWzk1LLygTGFbUuq_Yz_N74x_XHq1OVlemDgRtzXs4tFkVUvl66qZ_Kg/exec'; 
    const LIFF_ID = '2012189581-6oeaFkK4'; 
    const N8N_WEBHOOK_URL = 'https://xiaoyouke.app.n8n.cloud/webhook/e5a8448e-a200-46a7-a89e-712c35f042f9'; 

    let wordData = [];

    async function initializeLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('user-greeting').innerText = `嗨，${profile.displayName}！繼續保持！`;
        fetchWords(profile.userId); 
      } else {
        liff.login(); 
      }
    }

    async function fetchWords(userId) {
      const res = await fetch(`${GAS_URL}?userId=${userId}`);
      const json = await res.json();
      document.getElementById('loading').style.display = 'none';
      
      if (json.status === 'success' && json.data.length > 0) {
        wordData = json.data;
        document.getElementById('word-count').innerText = wordData.length;
        renderWords();
      } else {
        document.getElementById('word-list').innerHTML = '<p class="text-center text-slate-500">目前沒有單字喔！</p>';
      }
    }

    function renderWords() {
      const list = document.getElementById('word-list');
      list.innerHTML = '';
      wordData.forEach(word => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-100 transition-all';
        card.id = `row-${word.rowId}`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <h2 class="text-xl font-bold text-slate-800">${word.collocation}</h2>
              <p class="text-sm text-slate-500">${word.meaning}</p>
            </div>
            <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-xs rounded-lg font-bold">Lvl ${word.level}</span>
          </div>
          <div class="flex gap-2 mt-4">
            <button onclick="startAIPractice('${word.collocation}')" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-bold shadow-md shadow-indigo-200">
              🧠 AI 克漏字挑戰
            </button>
            <button onclick="archiveWord(${word.rowId})" class="px-4 bg-slate-100 text-slate-500 py-2 rounded-xl text-sm font-bold">
              歸檔
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function startAIPractice(targetWord) {
      Swal.fire({
        title: 'AI 即時出題中...',
        text: '正在為你量身打造情境句，請稍候！',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ word: targetWord })
        });
        const aiData = await res.json();
        
        const questionData = aiData.output || aiData; 

        Swal.fire({
          title: '克漏字挑戰！',
          html: `
            <p class="text-lg text-left font-medium text-slate-700 leading-relaxed mb-4">${questionData.Question}</p>
            <p class="text-sm text-left text-slate-400 mb-4">${questionData.Translation}</p>
            <input id="swal-input" class="swal2-input placeholder-slate-300" placeholder="請輸入答案...">
          `,
          confirmButtonText: '送出答案',
          confirmButtonColor: '#4f46e5',
          preConfirm: () => {
            const ans = document.getElementById('swal-input').value.toLowerCase().trim();
            if (ans === questionData.Answer.toLowerCase().trim()) {
              Swal.fire('答對了！🎉', '你的語感越來越好了！', 'success');
            } else {
              Swal.fire('再接再厲！💪', `正確答案是：<b>${questionData.Answer}</b>`, 'error');
            }
          }
        });
      } catch (err) {
        Swal.fire('連線失敗', '無法呼叫 AI，請檢查 n8n 設定。', 'error');
      }
    }

    async function archiveWord(rowId) {
      const card = document.getElementById(`row-${rowId}`);
      card.style.display = 'none';
      document.getElementById('word-count').innerText = Math.max(0, parseInt(document.getElementById('word-count').innerText) - 1);
      
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ rowId: rowId })
      });
    }

    initializeLiff();
  </script>
</body>
</html>
