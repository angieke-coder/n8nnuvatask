<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的專屬單字庫</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; color: #333; }
    .word-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .word-info h3 { margin: 0 0 5px 0; color: #2563eb; }
    .word-info p { margin: 0; color: #6b7280; font-size: 14px; }
    .delete-btn { background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .delete-btn:hover { background-color: #dc2828; }
    #loading { text-align: center; color: #6b7280; }
  </style>
</head>
<body>

  <div class="header">
    <h2>📚 我的專屬單字庫</h2>
  </div>
  
  <div id="loading">載入中...</div>
  <div id="word-list"></div>

  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 🔴 請在這裡填入你的設定值
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx3MqmYHS66UFBWzk1LLygTGFbUuq_Yz_N74x_XHq1OVlemDgRtzXs4tFkVUvl66qZ_Kg/exec';
    const LIFF_ID = '請貼上你的_LIFF_ID'; 

    let userId = '';

    // 初始化 LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        userId = profile.userId;
        fetchWords();
      } catch (err) {
        document.getElementById('loading').innerText = 'LIFF 載入失敗，請確認是否在 LINE 環境中開啟。';
      }
    }

    // 從 Google Sheets 抓取單字
    async function fetchWords() {
      try {
        const response = await fetch(`${GAS_API_URL}?userId=${userId}`);
        const result = await response.json();
        const wordList = document.getElementById('word-list');
        document.getElementById('loading').style.display = 'none';

        if (result.status === 'success' && result.data.length > 0) {
          result.data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.id = `row-${item.rowId}`;
            card.innerHTML = `
              <div class="word-info">
                <h3>${item.collocation}</h3>
                <p>${item.meaning} | Level ${item.level}</p>
              </div>
              <button class="delete-btn" onclick="markAsMastered(${item.rowId})">已熟記</button>
            `;
            wordList.appendChild(card);
          });
        } else {
          wordList.innerHTML = '<p style="text-align:center; color:#6b7280;">目前沒有單字喔！快去 LINE 查詢吧。</p>';
        }
      } catch (error) {
        document.getElementById('loading').innerText = '資料載入失敗。';
      }
    }

    // 將單字標記為已熟記 (軟刪除)
    async function markAsMastered(rowId) {
      // 畫面上先隱藏，讓使用者感覺瞬間刪除
      document.getElementById(`row-${rowId}`).style.display = 'none'; 
      
      // 背景發送 API 更新 Google Sheets
      await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ rowId: rowId })
      });
    }

    // 啟動程式
    initializeLiff();
  </script>
</body>
</html>
