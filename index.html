<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-800 pb-20">
  <div class="max-w-md mx-auto mt-4">
    <!-- 頂部戰鬥儀表板 -->
    <div class="bg-gradient-to-br from-indigo-900 to-indigo-600 rounded-3xl p-6 text-white shadow-xl mb-6">
      <h1 class="text-2xl font-black mb-1">Vocab Tracker</h1>
      <p class="text-indigo-200 text-sm mb-6" id="user-greeting">讀取中...</p>
      
      <div class="flex justify-between items-end mb-6">
        <div>
          <p class="text-4xl font-black" id="word-count">0</p>
          <p class="text-xs text-indigo-200 mt-1">進入遺忘曲線</p>
        </div>
        <div class="text-right">
          <p class="text-2xl font-bold text-yellow-400" id="mastered-count">0</p>
          <p class="text-xs text-indigo-200 mt-1">已貫通單字</p>
        </div>
      </div>

      <!-- 盲測啟動大按鈕 -->
      <button onclick="startTest('blind')" class="w-full bg-yellow-400 hover:bg-yellow-300 text-indigo-900 py-4 rounded-2xl text-lg font-black shadow-lg shadow-yellow-400/30 transition-all flex items-center justify-center gap-2">
        <span>🚀</span> 啟動今日學測盲測
      </button>
    </div>

    <!-- 分頁切換 -->
    <div class="flex gap-2 mb-6 bg-slate-200 p-1 rounded-xl">
      <button onclick="switchTab('review')" id="tab-review" class="flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600">🧠 記憶追蹤</button>
      <button onclick="switchTab('mastered')" id="tab-mastered" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-500">🏆 成就殿堂</button>
    </div>

    <div id="loading" class="text-center text-slate-500 animate-pulse my-10">資料同步中...</div>
    
    <!-- 單字庫清單 (雙軌制：可展開進行單點突破) -->
    <div id="word-list" class="space-y-3"></div>
    
    <!-- 成就殿堂 -->
    <div id="mastered-list" class="space-y-3 hidden">
      <div class="bg-yellow-50 border border-yellow-200 p-6 rounded-2xl text-center mb-4">
        <p class="text-3xl mb-2">👑</p>
        <h3 class="text-lg font-bold text-yellow-800 mb-1">大考單字霸主</h3>
        <p class="text-sm text-yellow-600">這些單字已深深刻入你的長期記憶！</p>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3MqmYHS66UFBWzk1LLygTGFbUuq_Yz_N74x_XHq1OVlemDgRtzXs4tFkVUvl66qZ_Kg/exec'; 
    const LIFF_ID = '2012189581-6oeaFkK4'; 
    const N8N_WEBHOOK_URL = 'https://xiaoyouke.app.n8n.cloud/webhook/e5a8448e-a200-46a7-a89e-712c35f042f9'; 

    let wordData = [];

    async function initializeLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('user-greeting').innerText = `指揮官 ${profile.displayName}，準備好突破極限了嗎？`;
        fetchWords(profile.userId); 
      } else {
        liff.login(); 
      }
    }

    async function fetchWords(userId) {
      const res = await fetch(`${GAS_URL}?userId=${userId}`);
      const json = await res.json();
      document.getElementById('loading').style.display = 'none';
      
      if (json.status === 'success' && json.data.length > 0) {
        wordData = json.data;
        document.getElementById('word-count').innerText = wordData.length;
        renderWords();
      } else {
        document.getElementById('word-list').innerHTML = '<p class="text-center text-slate-500">目前沒有待複習單字喔！</p>';
      }
    }

    function switchTab(tab) {
      if(tab === 'review') {
        document.getElementById('tab-review').className = 'flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600';
        document.getElementById('tab-mastered').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500';
        document.getElementById('word-list').classList.remove('hidden');
        document.getElementById('mastered-list').classList.add('hidden');
      } else {
        document.getElementById('tab-mastered').className = 'flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600';
        document.getElementById('tab-review').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500';
        document.getElementById('word-list').classList.add('hidden');
        document.getElementById('mastered-list').classList.remove('hidden');
      }
    }

    function renderWords() {
      const list = document.getElementById('word-list');
      list.innerHTML = '';
      wordData.forEach(word => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-400';
        card.id = `row-${word.rowId}`;
        card.innerHTML = `
          <div class="flex justify-between items-center cursor-pointer" onclick="toggleDetail(${word.rowId})">
            <div>
              <h2 class="text-lg font-bold text-slate-800">${word.collocation}</h2>
              <p class="text-sm text-slate-500">${word.meaning}</p>
            </div>
            <span class="text-[10px] bg-red-50 text-red-500 font-bold px-2 py-1 rounded-md">衰退中 ▼</span>
          </div>
          <div id="detail-${word.rowId}" class="hidden mt-4 pt-4 border-t border-slate-100">
             <button onclick="startTest('single', '${word.collocation}', ${word.rowId})" class="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 py-2 rounded-lg text-sm font-bold">
               🎯 針對此單字進行特訓
             </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleDetail(rowId) {
      const detailDiv = document.getElementById(`detail-${rowId}`);
      detailDiv.classList.toggle('hidden');
    }

    // 核心測驗邏輯 (支援 blind 與 single)
    async function startTest(mode, singleWord = '', rowId = null) {
      if (wordData.length === 0) return Swal.fire('太棒了', '目前沒有需要複習的單字！', 'success');

      let targetWords = [];
      let targetRows = [];

      if (mode === 'blind') {
        const shuffled = [...wordData].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);
        targetWords = selected.map(w => w.collocation);
        targetRows = selected.map(w => w.rowId);
      } else {
        targetWords = [singleWord];
        targetRows = [rowId];
      }

      Swal.fire({
        title: '連線命題中心...',
        text: 'AI 正在根據你的遺忘曲線生成考題',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words: targetWords }) // 統一把單字包成陣列傳給 n8n
        });
        
        let aiData = await res.json();
        let questions = aiData.output || aiData; 
        
        // 【超級防呆機制】：處理 AI 不穩定的輸出格式
        if (!Array.isArray(questions)) {
          // 如果 AI 只吐出單一物件，我們手動把它包進陣列裡
          if (questions.Question && questions.Answer) {
            questions = [questions];
          } else {
            throw new Error("API 格式錯誤：缺乏題目或答案");
          }
        }

        // 幫忘記寫 Type 的題目補上預設值
        questions.forEach(q => q.Type = q.Type || '綜合測驗');

        let correctCount = 0;
        for (let i = 0; i < questions.length; i++) {
          const q = questions[i];
          const currentRowId = targetRows[i];
          const currentWordStr = targetWords[i];

          const { value: ans } = await Swal.fire({
            title: `第 ${i+1}/${questions.length} 題`,
            html: `
              <div class="text-left mb-4">
                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded mb-2">${q.Type}</span>
                <p class="text-lg font-medium text-slate-700 leading-relaxed whitespace-pre-line">${q.Question}</p>
              </div>
              <input id="swal-input" class="swal2-input placeholder-slate-300" placeholder="請輸入單字...">
            `,
            confirmButtonText: '送出答案',
            confirmButtonColor: '#4f46e5',
            preConfirm: () => document.getElementById('swal-input').value.toLowerCase().trim()
          });

          // 精準字串比對
          if (ans === q.Answer.toLowerCase().trim()) {
            correctCount++;
            await Swal.fire('答對了！🎉', `<b>${q.Answer}</b><br><br>${q.Translation}`, 'success');
            archiveWord(currentRowId, currentWordStr); // 答對即刻歸檔
          } else {
            await Swal.fire('可惜！💪', `正確答案是：<b>${q.Answer}</b><br><br>${q.Translation}`, 'error');
          }
        }

        if (mode === 'blind') {
          Swal.fire('盲測結束', `本次連續挑戰答對 ${correctCount}/${questions.length} 題！`, 'info');
        }

      } catch (err) {
        console.error(err);
        Swal.fire('系統異常', '無法取得題目，請稍後再試。', 'error');
      }
    }

    async function archiveWord(rowId, wordString) {
      const card = document.getElementById(`row-${rowId}`);
      if(card) card.style.display = 'none';
      
      let currentCount = parseInt(document.getElementById('word-count').innerText);
      document.getElementById('word-count').innerText = Math.max(0, currentCount - 1);
      let masteredCount = parseInt(document.getElementById('mastered-count').innerText);
      document.getElementById('mastered-count').innerText = masteredCount + 1;

      const mList = document.getElementById('mastered-list');
      const mItem = document.createElement('div');
      mItem.className = 'bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400 flex items-center justify-between';
      mItem.innerHTML = `<span class="font-bold text-slate-700">${wordString}</span><span class="text-yellow-500 font-bold text-sm">⭐ 貫通</span>`;
      mList.appendChild(mItem);
      
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ rowId: rowId })
      });
    }

    initializeLiff();
  </script>
</body>
</html>
