<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-800 pb-20">
  <div class="max-w-md mx-auto mt-4">
    <!-- 頂部戰鬥儀表板 (The Arena) -->
    <div class="bg-gradient-to-br from-indigo-900 to-indigo-600 rounded-3xl p-6 text-white shadow-xl mb-6 relative overflow-hidden">
      <div class="absolute top-0 right-0 opacity-10 transform translate-x-4 -translate-y-4">
        <svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 3.83L19.17 20H4.83L12 5.83z"/></svg>
      </div>
      <h1 class="text-2xl font-black mb-1 tracking-wider">Vocab Tracker</h1>
      <p class="text-indigo-200 text-sm mb-6" id="user-greeting">讀取中...</p>
      
      <div class="flex justify-between items-end mb-6">
        <div>
          <p class="text-4xl font-black" id="word-count">0</p>
          <p class="text-xs text-indigo-200 mt-1">進入遺忘曲線</p>
        </div>
        <div class="text-right">
          <p class="text-2xl font-bold text-yellow-400" id="mastered-count">0</p>
          <p class="text-xs text-indigo-200 mt-1">已貫通單字</p>
        </div>
      </div>

      <!-- 盲測啟動大按鈕 -->
      <button onclick="startBlindTest()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-indigo-900 py-4 rounded-2xl text-lg font-black shadow-lg shadow-yellow-400/30 transition-all transform active:scale-95 flex items-center justify-center gap-2">
        <span>🚀</span> 啟動今日學測盲測
      </button>
    </div>

    <!-- 分頁切換 -->
    <div class="flex gap-2 mb-6 bg-slate-200 p-1 rounded-xl">
      <button onclick="switchTab('review')" id="tab-review" class="flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600 transition-all">🧠 記憶追蹤</button>
      <button onclick="switchTab('mastered')" id="tab-mastered" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 transition-all">🏆 成就殿堂</button>
    </div>

    <div id="loading" class="text-center text-slate-500 animate-pulse my-10">資料同步中...</div>
    
    <!-- 單字庫清單 (無劇透版) -->
    <div id="word-list" class="space-y-3"></div>
    
    <!-- 成就殿堂 -->
    <div id="mastered-list" class="space-y-3 hidden">
      <div class="bg-yellow-50 border border-yellow-200 p-6 rounded-2xl text-center mb-4">
        <p class="text-3xl mb-2">👑</p>
        <h3 class="text-lg font-bold text-yellow-800 mb-1">大考單字霸主</h3>
        <p class="text-sm text-yellow-600">這些單字已深深刻入你的長期記憶！</p>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3MqmYHS66UFBWzk1LLygTGFbUuq_Yz_N74x_XHq1OVlemDgRtzXs4tFkVUvl66qZ_Kg/exec'; 
    const LIFF_ID = '2012189581-6oeaFkK4'; 
    const N8N_WEBHOOK_URL = 'https://xiaoyouke.app.n8n.cloud/webhook/e5a8448e-a200-46a7-a89e-712c35f042f9'; 

    let wordData = [];

    async function initializeLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('user-greeting').innerText = `指揮官 ${profile.displayName}，準備好突破極限了嗎？`;
        fetchWords(profile.userId); 
      } else {
        liff.login(); 
      }
    }

    async function fetchWords(userId) {
      const res = await fetch(`${GAS_URL}?userId=${userId}`);
      const json = await res.json();
      document.getElementById('loading').style.display = 'none';
      
      if (json.status === 'success' && json.data.length > 0) {
        wordData = json.data;
        document.getElementById('word-count').innerText = wordData.length;
        renderWords();
      } else {
        document.getElementById('word-list').innerHTML = '<p class="text-center text-slate-500">目前沒有待複習單字喔！</p>';
      }
    }

    function switchTab(tab) {
      if(tab === 'review') {
        document.getElementById('tab-review').className = 'flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600 transition-all';
        document.getElementById('tab-mastered').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 transition-all';
        document.getElementById('word-list').classList.remove('hidden');
        document.getElementById('mastered-list').classList.add('hidden');
      } else {
        document.getElementById('tab-mastered').className = 'flex-1 bg-white shadow-sm py-2 rounded-lg text-sm font-bold text-indigo-600 transition-all';
        document.getElementById('tab-review').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 transition-all';
        document.getElementById('word-list').classList.add('hidden');
        document.getElementById('mastered-list').classList.remove('hidden');
      }
    }

    function renderWords() {
      const list = document.getElementById('word-list');
      list.innerHTML = '';
      wordData.forEach(word => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-400 flex justify-between items-center';
        card.id = `row-${word.rowId}`;
        card.innerHTML = `
          <div>
            <h2 class="text-lg font-bold text-slate-800">${word.collocation}</h2>
            <p class="text-sm text-slate-500">${word.meaning}</p>
          </div>
          <span class="text-[10px] bg-slate-100 text-slate-400 px-2 py-1 rounded-md">衰退中</span>
        `;
        list.appendChild(card);
      });
    }

    async function startBlindTest() {
      if (wordData.length === 0) {
        return Swal.fire('太棒了', '目前沒有需要複習的單字！', 'success');
      }

      // 隨機抽取 3 個單字（盲測核心邏輯）
      const shuffled = [...wordData].sort(() => 0.5 - Math.random());
      const selectedWords = shuffled.slice(0, 3);
      const targetCollocations = selectedWords.map(w => w.collocation);

      Swal.fire({
        title: '連線大考中心 AI...',
        text: '正在根據你的遺忘曲線，動態生成學測情境題',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 傳送陣列給 n8n
          body: JSON.stringify({ words: targetCollocations, mode: 'exam_mix' })
        });
        
        let aiData = await res.json();
        // 假設 n8n 現在回傳的是陣列格式 (List of JSONs)
        const questions = aiData.output || aiData; 
        
        if (!Array.isArray(questions)) {
           throw new Error("n8n 未回傳題庫陣列");
        }

        // 連續彈窗作答邏輯
        let correctCount = 0;
        for (let i = 0; i < questions.length; i++) {
          const q = questions[i];
          const matchedWordObj = selectedWords[i];

          const { value: ans } = await Swal.fire({
            title: `第 ${i+1}/${questions.length} 題`,
            html: `
              <div class="text-left mb-4">
                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded mb-2">${q.Type || '綜合測驗'}</span>
                <p class="text-lg font-medium text-slate-700 leading-relaxed">${q.Question}</p>
              </div>
              <input id="swal-input" class="swal2-input placeholder-slate-300" placeholder="請輸入答案...">
            `,
            confirmButtonText: '送出答案',
            confirmButtonColor: '#4f46e5',
            preConfirm: () => document.getElementById('swal-input').value.toLowerCase().trim()
          });

          if (ans === q.Answer.toLowerCase().trim()) {
            correctCount++;
            await Swal.fire('答對了！🎉', `<b>${q.Answer}</b><br><br>${q.Translation}`, 'success');
            // 答對就歸檔
            if(matchedWordObj) archiveWord(matchedWordObj.rowId, matchedWordObj.collocation);
          } else {
            await Swal.fire('可惜！💪', `正確答案是：<b>${q.Answer}</b><br><br>${q.Translation}`, 'error');
          }
        }

        Swal.fire('盲測結束', `本次連續挑戰答對 ${correctCount}/${questions.length} 題！`, 'info');

      } catch (err) {
        console.error(err);
        Swal.fire('系統異常', '請檢查 n8n 是否設定為回傳 JSON 陣列。', 'error');
      }
    }

    async function archiveWord(rowId, wordString) {
      const card = document.getElementById(`row-${rowId}`);
      if(card) card.style.display = 'none';
      
      let currentCount = parseInt(document.getElementById('word-count').innerText);
      document.getElementById('word-count').innerText = Math.max(0, currentCount - 1);
      
      let masteredCount = parseInt(document.getElementById('mastered-count').innerText);
      document.getElementById('mastered-count').innerText = masteredCount + 1;

      const mList = document.getElementById('mastered-list');
      const mItem = document.createElement('div');
      mItem.className = 'bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400 flex items-center justify-between';
      mItem.innerHTML = `<span class="font-bold text-slate-700">${wordString}</span><span class="text-yellow-500 font-bold text-sm">⭐ 貫通</span>`;
      mList.appendChild(mItem);
      
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ rowId: rowId })
      });
    }

    initializeLiff();
  </script>
</body>
</html>
